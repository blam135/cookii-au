name: Deploy backend to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    # Changed file paths for PR checks, not branch-name patterns.
    paths:
      - 'backend/**'
      - 'tests/fixtures/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test and validate backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck backend
        run: pnpm --filter cookii-reviews-worker typecheck
      - name: Test backend
        run: pnpm --filter cookii-reviews-worker test
      - name: Audit workspace dependencies
        run: pnpm audit --audit-level=low
      - name: Validate backend deployment bundle
        run: pnpm --filter cookii-reviews-worker check

  deploy:
    name: Deploy backend to Cloudflare Workers
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Cloudflare backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          TURNSTILE_HOSTNAME: ${{ vars.TURNSTILE_HOSTNAME }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          SUBMISSIONS_ENABLED: ${{ vars.SUBMISSIONS_ENABLED || 'false' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
        run: pnpm --filter cookii-reviews-worker deploy:ci

name: Deploy frontend to GitHub Pages

on:
  workflow_run:
    workflows: ['Deploy backend to Cloudflare Workers']
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'backend/src/reviews/schema.ts'
      - 'scripts/**'
      - 'tests/**'
      - 'backend/package.json'
      - 'playwright.config.ts'
      - 'next.config.ts'
      - '.env.example'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Finish an active deployment before starting the next production run.
  cancel-in-progress: false

jobs:
  build:
    name: Test and build frontend
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security regression tests
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --audit-level=low

      - name: Build frontend static site
        env:
          NEXT_PUBLIC_REVIEWS_ENABLED: ${{ vars.NEXT_PUBLIC_REVIEWS_ENABLED || 'false' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_REVIEWS_API_URL: ${{ vars.NEXT_PUBLIC_REVIEWS_API_URL }}
        run: pnpm run build

      - name: Install Chromium for frontend browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Test exported frontend in Chromium
        env:
          NEXT_PUBLIC_REVIEWS_ENABLED: ${{ vars.NEXT_PUBLIC_REVIEWS_ENABLED || 'false' }}
          PLAYWRIGHT_START_SERVER: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: pnpm exec playwright test --project=chromium

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./out

  security-browser:
    name: Test review security with reviews enabled
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build isolated security fixture (never published)
        run: pnpm run build
        env:
          NEXT_PUBLIC_REVIEWS_ENABLED: 'true'
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: test-only-site-key
          NEXT_PUBLIC_REVIEWS_API_URL: https://reviews.example.invalid
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser security and verification checks
        run: pnpm exec playwright test --project=chromium
        env:
          NEXT_PUBLIC_REVIEWS_ENABLED: 'true'
          PLAYWRIGHT_START_SERVER: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, security-browser]

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Deploy frontend to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

name: Capture review layout for PR 41
on:
  push:
    branches: ['codex/review-layout-screenshots']
    paths: ['capture-review-layout.mjs', '.github/workflows/capture-review-layout.yml']
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_REVIEWS_ENABLED: 'true'
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          NEXT_PUBLIC_REVIEWS_API_URL: https://reviews.example.invalid
      - run: mv out "$RUNNER_TEMP/verified-reviews"
      - run: pnpm build
        env:
          NEXT_PUBLIC_REVIEWS_ENABLED: 'true'
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 3x00000000000000000000FF
          NEXT_PUBLIC_REVIEWS_API_URL: https://reviews.example.invalid
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture desktop and mobile in Chromium
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/verified-reviews" >/tmp/cookii-preview.log 2>&1 &
          python3 -m http.server 3001 --bind 127.0.0.1 --directory out >/tmp/cookii-interactive.log 2>&1 &
          curl --silent --retry 10 --retry-delay 1 --retry-connrefused --output /dev/null http://127.0.0.1:3000
          node capture-review-layout.mjs
      - name: Save the review images on this media branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- review-layout-media
          git commit -m 'Capture desktop and mobile screenshots for review layout'
          git push origin HEAD:refs/heads/codex/review-layout-screenshots
